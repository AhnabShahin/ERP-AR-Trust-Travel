version: '3.8'

services:
  ar-trust-travel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ar-trust-travel-erp
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
